<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pipeline-monitor</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script src="vendor/elkjs/elk-api.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <span class="brand">pipeline-monitor</span>
  <select id="pipeline-select" aria-label="Pipeline" hidden></select>
  <span id="pipeline-name"></span>
  <span id="pipeline-state" class="state"></span>
  <span id="element-count" class="muted"></span>
  <span id="pipeline-times" class="muted times" hidden></span>
  <span class="spacer"></span>
  <button id="problems-counter" class="problems-counter"
    aria-controls="findings-panel" aria-expanded="false">No problems</button>
  <button id="log-counter" class="log-counter" aria-controls="log-panel"
    aria-expanded="false" hidden>No errors</button>
  <span id="connection" class="connection">connecting</span>
</header>
<main>
  <svg id="graph" role="img" aria-label="Pipeline graph"></svg>
  <svg id="pin-lines" aria-hidden="true"></svg>
  <div id="pins"></div>
  <div id="empty" class="empty" hidden>Waiting for a pipeline…</div>
  <div id="ended" class="ended-banner" hidden>The program has ended: this is
    its last state. A new run on this address is picked up by itself.</div>
  <div id="pick-hint" class="pick-hint" hidden>Click the pad to measure from · Esc to cancel</div>
  <div class="toolbar">
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="auto-fit" title="Fit the graph to the window and keep it fitted"
      aria-pressed="true">auto-fit</button>
    <button id="caps-labels" title="Show the caps on all links"
      aria-pressed="false">caps</button>
    <button id="measure-all" aria-pressed="false"
      title="Measure how long data takes through every element">latency</button>
    <button id="time-unit" title="Unit of times in pinned pads: auto, ns, ms or s">time: auto</button>
  </div>
  <aside id="details" hidden></aside>
</main>
<section id="findings-panel" class="log-panel" aria-label="Problems" hidden>
  <div class="log-head">
    <strong>Problems</strong>
    <span class="muted">found in the running pipeline, updated every second</span>
    <span class="spacer"></span>
    <button id="findings-close" class="close" title="Close">×</button>
  </div>
  <div id="findings-rows" class="log-rows"></div>
</section>
<section id="log-panel" class="log-panel" aria-label="Errors and warnings" hidden>
  <div class="log-head">
    <strong>Errors and warnings</strong>
    <span id="log-muted" class="log-muted"></span>
    <span class="spacer"></span>
    <button id="log-clear" title="Hide everything seen so far (this browser only)">clear</button>
    <button id="log-close" class="close" title="Close">×</button>
  </div>
  <div id="log-rows" class="log-rows"></div>
</section>
</body>
</html>
