name: Release

# Builds the packages, then installs each one on a fresh machine the way a
# user would and checks that the tracer serves its page. On a version tag,
# and only if every check passed, attaches them to the tag's draft release.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['packaging/**', '.github/workflows/release.yml', 'meson.build']
  pull_request:
    paths: ['packaging/**', '.github/workflows/release.yml', 'meson.build']
  workflow_dispatch:

jobs:
  deb:
    name: Build .deb (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          apt() { timeout 480 apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 "$@"; }
          for try in 1 2; do
            apt update && apt install -y --no-install-recommends \
              git ca-certificates meson ninja-build pkg-config gcc \
              dpkg-dev libglib2.0-dev-bin libgstreamer1.0-dev \
              libsoup-3.0-dev libjson-glib-dev python3 && exit 0
            echo "apt-get failed or hung (try $try)"
          done
          exit 1
      - uses: actions/checkout@v4
      - name: Build
        run: |
          meson setup build --prefix=/usr --buildtype=release
          meson compile -C build
      - name: Package
        run: packaging/build-deb.sh build dist
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.image == 'debian:12' && 'debian12' || 'ubuntu24.04' }}-${{ matrix.arch }}
          path: dist/*.deb

  # Where nothing was built: apt must find every dependency.
  deb-check:
    name: Check .deb (${{ matrix.image }}, ${{ matrix.arch }})
    needs: deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12']
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      DISTRO: ${{ matrix.image == 'debian:12' && 'debian12' || 'ubuntu24.04' }}
    steps:
      - name: Install tools
        timeout-minutes: 10
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git \
            gstreamer1.0-tools
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
      - uses: actions/download-artifact@v4
        with:
          name: deb-${{ env.DISTRO }}-${{ matrix.arch }}
          path: new
      - name: Install the latest published package first
        run: |
          url=$(curl -fsS https://api.github.com/repos/imgbit/pipeline-monitor/releases/latest |
            sed -n "s/.*\"browser_download_url\": \"\(.*[.~]${DISTRO}_${{ matrix.arch }}\.deb\)\".*/\1/p")
          if [ -z "$url" ]; then
            echo "No published package yet: upgrade not checked" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsSL -o old.deb "$url"
          apt-get install -y --no-install-recommends ./old.deb
          dpkg-query -W pipeline-monitor
      - name: Install (or upgrade to) this package
        run: |
          apt-get install -y --no-install-recommends ./new/*.deb
          dpkg-query -W pipeline-monitor
          [ "$(dpkg-query -W -f '${Version}' pipeline-monitor)" = \
            "$(dpkg-deb -f new/*.deb Version)" ]
      - name: Load
        run: |
          export GST_REGISTRY=$RUNNER_TEMP/registry.bin
          gst-inspect-1.0 pipeline-monitor
          packaging/smoke-test.sh
      - name: Command
        run: packaging/command-test.sh
      - name: Remove
        run: |
          plugin=$(dpkg -L pipeline-monitor | grep 'libgstpipelinemonitor\.so$')
          apt-get remove -y pipeline-monitor
          [ ! -e "$plugin" ]
          [ ! -e /usr/bin/pipeline-monitor ]

  macos-framework:
    name: Build macOS zip (GStreamer.framework, universal)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GST_VERSION: 1.28.8
      GST_SHA256: d371ab04a7632713626836c2fc234e863cc98484c74c473eba99b0fbd9b3a3fe
      GST_DEVEL_SHA256: e6d380bc17be7eccf13e0154567d4718fc9321da822408c7ca0cd808b3d4a3f7
      FW: /Library/Frameworks/GStreamer.framework/Versions/1.0
    steps:
      - uses: actions/checkout@v4
      # The installers, kept between runs: the download server drops long
      # transfers. Tag runs restore what a run on main saved.
      - uses: actions/cache@v4
        with:
          path: gst-pkg
          key: gst-osx-${{ env.GST_VERSION }}-${{ env.GST_SHA256 }}-${{ env.GST_DEVEL_SHA256 }}
      - name: Install GStreamer.framework
        timeout-minutes: 30
        run: |
          base=https://gstreamer.freedesktop.org/data/pkg/osx/$GST_VERSION
          mkdir -p gst-pkg
          for p in "gstreamer-1.0-$GST_VERSION-universal.pkg:$GST_SHA256" \
                   "gstreamer-1.0-devel-$GST_VERSION-universal.pkg:$GST_DEVEL_SHA256"; do
            f=${p%%:*}
            packaging/fetch.sh "$base/$f" "${p##*:}" "gst-pkg/$f"
            sudo installer -pkg "gst-pkg/$f" -target /
          done
      - name: Install Meson
        run: brew install meson ninja pkgconf
      - name: Build
        run: |
          # Only the framework's libraries, never Homebrew's.
          export PKG_CONFIG_LIBDIR=$FW/lib/pkgconfig
          export PATH=$FW/bin:$PATH
          arch="-arch arm64 -arch x86_64"
          meson setup build --buildtype=release \
            -Dc_args="$arch" \
            -Dc_link_args="$arch -Wl,-rpath,$FW -Wl,-rpath,$FW/lib"
          meson compile -C build
      - name: Package
        run: |
          lib=build/src/libgstpipelinemonitor.dylib
          tool=build/src/pipeline-monitor
          for f in $lib $tool; do
            lipo -archs $f | grep -q arm64
            lipo -archs $f | grep -q x86_64
            ! otool -L $f | grep -q /opt/homebrew
          done
          version=$(meson introspect build --projectinfo |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          name=pipeline-monitor-$version-macos-framework-universal
          mkdir -p dist/$name
          cp $lib $tool LICENSE dist/$name/
          cat > dist/$name/README.txt <<EOF
          pipeline-monitor $version for the official GStreamer.framework
          (macOS, Apple Silicon and Intel), GStreamer 1.28 or newer.

          Not for Homebrew's GStreamer: use brew install imgbit/tap/pipeline-monitor

          Use:
            export GST_PLUGIN_PATH=/path/to/this/folder
            export GST_TRACERS=pipeline-monitor
            gst-launch-1.0 videotestsrc ! autovideosink
          then open the address it prints.

          To open recordings without a program:
            ./pipeline-monitor              (the recordings folder)
            ./pipeline-monitor open FILE    (that recording)

          Files downloaded with a browser are marked as quarantined, and
          macOS may refuse to load or run them. Remove the mark with:
            xattr -d com.apple.quarantine libgstpipelinemonitor.dylib pipeline-monitor

          https://github.com/imgbit/pipeline-monitor
          EOF
          (cd dist && zip -r $name.zip $name)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-framework
          path: dist/*.zip

  # Only the framework's runtime package, as a user would have it.
  macos-framework-check:
    name: Check macOS zip
    needs: macos-framework
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      GST_VERSION: 1.28.8
      GST_SHA256: d371ab04a7632713626836c2fc234e863cc98484c74c473eba99b0fbd9b3a3fe
      FW: /Library/Frameworks/GStreamer.framework/Versions/1.0
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging
      - uses: actions/download-artifact@v4
        with:
          name: macos-framework
      - uses: actions/cache@v4
        with:
          path: gst-pkg
          key: gst-osx-runtime-${{ env.GST_VERSION }}-${{ env.GST_SHA256 }}
      - name: Install GStreamer.framework (runtime only)
        timeout-minutes: 30
        run: |
          f=gstreamer-1.0-$GST_VERSION-universal.pkg
          mkdir -p gst-pkg
          packaging/fetch.sh \
            "https://gstreamer.freedesktop.org/data/pkg/osx/$GST_VERSION/$f" \
            "$GST_SHA256" "gst-pkg/$f"
          sudo installer -pkg "gst-pkg/$f" -target /
      - name: Unpack
        run: |
          unzip -q pipeline-monitor-*.zip
          echo "PLUGIN_DIR=$PWD/$(ls -d pipeline-monitor-*/ | head -n 1)" >> "$GITHUB_ENV"
      - name: Load (Apple Silicon)
        run: |
          export PATH=$FW/bin:$PATH GST_PLUGIN_PATH=$PLUGIN_DIR
          export GST_REGISTRY=$RUNNER_TEMP/arm64.bin
          gst-inspect-1.0 pipeline-monitor
          packaging/smoke-test.sh
          COMMAND=$PLUGIN_DIR/pipeline-monitor packaging/command-test.sh
      - name: Load (Intel, through Rosetta)
        run: |
          if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            echo "No Rosetta on this runner: Intel not checked" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export GST_PLUGIN_PATH=$PLUGIN_DIR GST_REGISTRY=$RUNNER_TEMP/x86_64.bin
          arch -x86_64 $FW/bin/gst-inspect-1.0 pipeline-monitor
          LAUNCH="arch -x86_64 $FW/bin/gst-launch-1.0" packaging/smoke-test.sh
          COMMAND="arch -x86_64 $PLUGIN_DIR/pipeline-monitor" \
            packaging/command-test.sh
      # Reports only: shows whether the xattr step in README.txt is needed.
      - name: Load when quarantined
        run: |
          q=$RUNNER_TEMP/quarantined
          cp -R "$PLUGIN_DIR" "$q"
          xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" \
            "$q/libgstpipelinemonitor.dylib"
          xattr -l "$q/libgstpipelinemonitor.dylib"
          if GST_PLUGIN_PATH=$q GST_REGISTRY=$RUNNER_TEMP/q.bin \
              $FW/bin/gst-inspect-1.0 pipeline-monitor > /dev/null 2>&1; then
            echo "Quarantined library: loads" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Quarantined library: does not load" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  windows:
    name: Build Windows zip (MSVC, official GStreamer)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GST_VERSION: 1.28.8
      GST_SHA256: e4c41ee6ee9c6c32a45d198463ec08d79bac3bd5fa58adc93d13fe4a08abc9d9
      GST_ROOT: C:\gstreamer
    steps:
      - uses: actions/checkout@v4
      - name: Install GStreamer
        shell: pwsh
        run: |
          $exe = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          Invoke-WebRequest "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/$exe" -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:GST_SHA256) { throw "checksum mismatch" }
          Start-Process -Wait -FilePath ".\$exe" -ArgumentList "/VERYSILENT","/NORESTART","/ALLUSERS","/TYPE=devel","/DIR=$env:GST_ROOT"
          Remove-Item $exe
          Add-Content $env:GITHUB_PATH "$env:GST_ROOT\bin"
          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$env:GST_ROOT\lib\pkgconfig"
      - name: Install Meson
        run: pip install meson ninja
      - name: Build
        run: |
          meson setup build --vsenv --buildtype=release
          meson compile -C build
      - name: Package
        shell: pwsh
        run: |
          $version = (meson introspect build --projectinfo | ConvertFrom-Json).version
          $name = "pipeline-monitor-$version-windows-msvc-x86_64"
          New-Item -ItemType Directory -Force "dist\$name" | Out-Null
          Copy-Item build\src\gstpipelinemonitor.dll, build\src\pipeline-monitor.exe, LICENSE "dist\$name"
          @"
          pipeline-monitor $version for the official GStreamer MSVC x86_64
          package, GStreamer 1.28 or newer.

          Use, in a command prompt:
            set GST_PLUGIN_PATH=C:\path\to\this\folder
            set GST_TRACERS=pipeline-monitor
            gst-launch-1.0 videotestsrc ! autovideosink
          then open the address it prints. Or copy gstpipelinemonitor.dll
          into GStreamer's lib\gstreamer-1.0 folder and skip GST_PLUGIN_PATH.

          To open recordings without a program (GStreamer's bin folder in
          PATH):
            pipeline-monitor.exe              (the recordings folder)
            pipeline-monitor.exe open FILE    (that recording)

          These files are not signed. Windows may warn before running
          pipeline-monitor.exe; if the files are blocked, run Unblock-File
          on them in PowerShell, or use Properties > Unblock.

          https://github.com/imgbit/pipeline-monitor
          "@ | Set-Content "dist\$name\README.txt"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  # The runtime installer only, as a user would have it.
  windows-check:
    name: Check Windows zip
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GST_VERSION: 1.28.8
      GST_RUNTIME_SHA256: e4c41ee6ee9c6c32a45d198463ec08d79bac3bd5fa58adc93d13fe4a08abc9d9
      GST_ROOT: C:\gstreamer
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Install GStreamer (runtime only)
        shell: pwsh
        run: |
          $exe = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          Invoke-WebRequest "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/$exe" -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:GST_RUNTIME_SHA256) { throw "checksum mismatch" }
          Start-Process -Wait -FilePath ".\$exe" -ArgumentList "/VERYSILENT","/NORESTART","/ALLUSERS","/DIR=$env:GST_ROOT"
          Remove-Item $exe
          Add-Content $env:GITHUB_PATH "$env:GST_ROOT\bin"
      - name: Unpack
        shell: pwsh
        run: |
          $zip = Get-ChildItem pipeline-monitor-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath unpacked
          $dir = (Get-ChildItem unpacked -Directory | Select-Object -First 1).FullName
          Add-Content $env:GITHUB_ENV "GST_PLUGIN_PATH=$dir"
          Add-Content $env:GITHUB_ENV "GST_REGISTRY=$env:RUNNER_TEMP\registry.bin"
      - name: Load
        shell: pwsh
        run: |
          gst-inspect-1.0 pipeline-monitor
          if ($LASTEXITCODE -ne 0) { throw "plugin did not load" }
      - name: Smoke test
        shell: pwsh
        run: |
          $env:GST_TRACERS = "pipeline-monitor(port=0)"
          $err = "$env:RUNNER_TEMP\launch.log"
          $p = Start-Process gst-launch-1.0 -PassThru -NoNewWindow -RedirectStandardError $err `
            -ArgumentList "fakesrc","sizetype=fixed","!","identity","name=smoke","sleep-time=10000","!","fakesink"
          try {
            $url = $null
            for ($i = 0; $i -lt 150 -and -not $url; $i++) {
              Start-Sleep -Milliseconds 200
              $m = Select-String -Path $err -Pattern '^pipeline-monitor: (http://\S+)' -ErrorAction SilentlyContinue
              if ($m) { $url = $m.Matches[0].Groups[1].Value }
            }
            if (-not $url) { Get-Content $err; throw "the tracer printed no address" }
            $page = Invoke-WebRequest -UseBasicParsing $url
            if ($page.Content -notmatch '<title>pipeline-monitor</title>') { throw "no page at $url" }
            $found = $false
            for ($i = 0; $i -lt 50 -and -not $found; $i++) {
              $found = (Invoke-WebRequest -UseBasicParsing "${url}api/graph").Content -match '"name":"smoke"'
              if (-not $found) { Start-Sleep -Milliseconds 200 }
            }
            if (-not $found) { throw "the pipeline is not in ${url}api/graph" }
            Write-Output "smoke test passed: $url"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Command
        shell: pwsh
        run: |
          $exe = Join-Path $env:GST_PLUGIN_PATH "pipeline-monitor.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "the command did not run" }
          $dir = New-Item -ItemType Directory "$env:RUNNER_TEMP\recordings"
          $out = "$env:RUNNER_TEMP\command.log"
          $p = Start-Process $exe -PassThru -NoNewWindow -RedirectStandardOutput $out `
            -ArgumentList "--no-browser","--port","0","--recordings",$dir.FullName
          try {
            $url = $null
            for ($i = 0; $i -lt 150 -and -not $url; $i++) {
              Start-Sleep -Milliseconds 200
              $m = Select-String -Path $out -Pattern '^pipeline-monitor: (http://[^#]+)' -ErrorAction SilentlyContinue
              if ($m) { $url = $m.Matches[0].Groups[1].Value }
            }
            if (-not $url) { Get-Content $out; throw "the command printed no address" }
            $page = Invoke-WebRequest -UseBasicParsing $url
            if ($page.Content -notmatch '<title>pipeline-monitor</title>') { throw "no page at $url" }
            if ((Invoke-WebRequest -UseBasicParsing "${url}api/hello").Content -notmatch '"viewer":true') { throw "not a viewer" }
            Write-Output "command test passed: $url"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

  release:
    name: Attach to the draft release
    if: github.ref_type == 'tag'
    needs: [deb-check, macos-framework-check, windows-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag matches the version
        run: |
          version=$(sed -n "s/^  version : '\(.*\)',$/\1/p" meson.build)
          [ "v$version" = "$TAG" ]
      - name: Upload
        run: |
          ls -l dist
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag \
              --title "pipeline-monitor ${TAG#v}" --notes "Draft"
          gh release upload "$TAG" dist/* --clobber
