name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [default, sanitizers, threads]
    steps:
      - uses: actions/checkout@v4
      # A package mirror that hangs used to block this step for 20+
      # minutes: a download silent for 30 s is retried, each try is
      # limited, and it is tried twice.
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          apt() { timeout 240 sudo apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 "$@"; }
          for try in 1 2; do
            apt update && apt install -y --no-install-recommends \
              meson ninja-build pkg-config libglib2.0-dev-bin \
              libgstreamer1.0-dev gstreamer1.0-plugins-base \
              gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
              libsoup-3.0-dev libjson-glib-dev python3 && exit 0
            echo "apt-get failed or hung (try $try)"
          done
          exit 1
      # ThreadSanitizer cannot map its memory with the high address
      # randomization of Ubuntu 24.04 runners.
      - name: Lower address randomization
        if: matrix.variant == 'threads'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build
        run: |
          case "${{ matrix.variant }}" in
            sanitizers)
              meson setup build -Db_sanitize=address,undefined -Db_lundef=false ;;
            threads)
              meson setup build -Db_sanitize=thread -Db_lundef=false ;;
            *)
              meson setup build ;;
          esac
          meson compile -C build
      - name: Test
        env:
          GST_REGISTRY_FORK: ${{ matrix.variant != 'default' && 'no' || '' }}
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: >-
            halt_on_error=1:second_deadlock_stack=1:suppressions=${{
            github.workspace }}/tests/tsan.supp
        # ThreadSanitizer makes the tests several times slower.
        run: >-
          meson test -C build --print-errorlogs --verbose
          ${{ matrix.variant == 'threads' && '--timeout-multiplier 3' || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testlog-ubuntu-${{ matrix.variant }}
          path: build/meson-logs/

  debian-12:
    name: Debian 12 (GStreamer 1.22)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: debian:12
    steps:
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          apt() { timeout 240 apt-get -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 "$@"; }
          for try in 1 2; do
            apt update && apt install -y --no-install-recommends \
              git ca-certificates meson ninja-build pkg-config gcc \
              libglib2.0-dev-bin libgstreamer1.0-dev \
              gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad libsoup-3.0-dev libjson-glib-dev \
              python3 && exit 0
            echo "apt-get failed or hung (try $try)"
          done
          exit 1
      - uses: actions/checkout@v4
      - name: Build
        run: meson setup build && meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs --verbose
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testlog-debian-12
          path: build/meson-logs/

  macos:
    name: macOS (Homebrew)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        timeout-minutes: 15
        run: brew install meson ninja pkgconf gstreamer libsoup json-glib
      - name: Build
        run: meson setup build && meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs --verbose
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testlog-macos
          path: build/meson-logs/


  windows:
    name: Windows (MSVC, official GStreamer)
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GST_VERSION: 1.28.8
      GST_SHA256: e4c41ee6ee9c6c32a45d198463ec08d79bac3bd5fa58adc93d13fe4a08abc9d9
      GST_ROOT: C:\gstreamer
    steps:
      - uses: actions/checkout@v4
      - name: Restore GStreamer
        id: gst-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\gstreamer
          key: gstreamer-msvc-x86_64-${{ env.GST_VERSION }}-${{ env.GST_SHA256 }}
      - name: Install GStreamer
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $exe = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          Invoke-WebRequest "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/$exe" -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne $env:GST_SHA256) { throw "checksum mismatch" }
          Start-Process -Wait -FilePath ".\$exe" -ArgumentList "/VERYSILENT","/NORESTART","/ALLUSERS","/TYPE=devel","/DIR=$env:GST_ROOT"
          Remove-Item $exe
      # Saved right after installing, so failing tests don't prevent it.
      - name: Save GStreamer
        if: steps.gst-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\gstreamer
          key: ${{ steps.gst-cache.outputs.cache-primary-key }}
      - name: Set up GStreamer paths
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_PATH "$env:GST_ROOT\bin"
          Add-Content $env:GITHUB_ENV "PKG_CONFIG_PATH=$env:GST_ROOT\lib\pkgconfig"
      - name: Install Meson
        run: pip install meson ninja
      - name: Build
        run: |
          meson setup build --vsenv
          meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs --verbose
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testlog-windows
          path: build/meson-logs/
